name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # WebP encodes of logos/ PNGs, keyed by content hash; saves ~5 minutes per run.
      - uses: actions/cache@v4
        with:
          path: .cache/webp
          key: webp-${{ hashFiles('logos/**/*.png') }}
          restore-keys: webp-
      - run: npm run validate
      - run: npm run normalize -- --check
      - run: npm run format:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run size
