name: Release

on:
  push:
    branches: [main]
  # Lets you start a release run by hand from the Actions tab.
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the "Version packages" commit and tags
  pull-requests: write # open the "Version packages" PR
  id-token: write # npm provenance (and npm trusted publishing, if configured)

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .cache/webp
          key: webp-${{ hashFiles('logos/**/*.png') }}
          restore-keys: webp-
      - run: npm test
      # Fail early with a clear message instead of npm's ENEEDAUTH when the publish token is missing.
      # Only on publish runs (no pending changesets); version-PR runs don't need the token.
      - name: Check npm token
        if: hashFiles('.changeset/*.md', '!.changeset/README.md') == ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::The NPM_TOKEN repository secret is empty or missing. Add it under Settings > Secrets and variables > Actions (name: NPM_TOKEN)."
            exit 1
          fi
      # With pending changesets: opens/updates the "Version packages" PR.
      # After that PR is merged: builds and publishes to npm with provenance.
      - uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: Version packages
          commit-message: Version packages
          # v2 requires the token as an input (the GITHUB_TOKEN env var is no longer used).
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # setup-node's .npmrc reads NODE_AUTH_TOKEN; changesets reads NPM_TOKEN. Set both.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
