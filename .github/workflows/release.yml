name: Release

on:
  push:
    branches: [main]
  # Lets you start a release run by hand from the Actions tab.
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the "Version packages" commit, tags and GitHub Releases
  pull-requests: write # open the "Version packages" PR
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .cache/webp
          key: webp-${{ hashFiles('logos/**/*.png') }}
          restore-keys: webp-
      - run: npm test
      # npm trusted publishing (OIDC, no token) needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      # Changesets handles versioning only: with pending changesets it opens/updates the "Version packages" PR.
      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          pr-title: Version packages
          commit-message: Version packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # With no pending changesets (the version PR was merged): publish the new version ourselves, exactly as
      # npm documents for trusted publishing + provenance, then verify the attestation really landed.
      - name: Publish to npm with provenance
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./packages/core/package.json').name")
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$NAME@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          npm run build
          (cd packages/core && npm publish --provenance --access public)
          # npm can take a few minutes to list trusted-publishing releases; wait for the version and its provenance.
          for i in $(seq 1 30); do
            if curl -sf "https://registry.npmjs.org/-/npm/v1/attestations/$NAME@$VERSION" >/dev/null; then
              echo "$NAME@$VERSION is on npm with provenance."; break
            fi
            if [ "$i" = 30 ]; then echo "::error::$NAME@$VERSION has no provenance attestation on npm."; exit 1; fi
            sleep 20
          done
          # Tag and GitHub Release, with this version's CHANGELOG section as notes.
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' packages/core/CHANGELOG.md > release-notes.md
          gh release create "$NAME@$VERSION" --target "$GITHUB_SHA" --title "$NAME@$VERSION" --notes-file release-notes.md
