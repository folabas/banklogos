name: Release

on:
  push:
    branches: [main]
  # Lets you start a release run by hand from the Actions tab.
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the "Version packages" commit and tags
  pull-requests: write # open the "Version packages" PR
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .cache/webp
          key: webp-${{ hashFiles('logos/**/*.png') }}
          restore-keys: webp-
      - run: npm test
      # npm trusted publishing (OIDC, no token) needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      # With pending changesets: opens/updates the "Version packages" PR.
      # After that PR is merged: builds and publishes to npm with provenance.
      - uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: Version packages
          commit-message: Version packages
          # v2 requires the token as an input (the GITHUB_TOKEN env var is no longer used).
          github-token: ${{ secrets.GITHUB_TOKEN }}
        # Publishing uses npm trusted publishing: npmjs.com trusts this repo's release.yml via GitHub OIDC
        # (id-token: write above), so no NPM_TOKEN secret is needed and provenance is attached automatically.
        env:
          NPM_CONFIG_PROVENANCE: true
